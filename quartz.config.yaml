# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 잔향의 마음 로그
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  locale: ko-KR
  baseUrl: slowdive14.github.io/digital-garden
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Gowun Batang
      body: IBM Plex Sans KR
      code: IBM Plex Mono
    # One accent (deep garden green) on warm paper; see DESIGN.md.
    colors:
      lightMode:
        light: "#fbfaf6"
        lightgray: "#e6e3da"
        gray: "#6f726b"
        darkgray: "#33362f"
        dark: "#1c1f1b"
        secondary: "#2f6b5a"
        tertiary: "#b07a4f"
        highlight: rgba(47, 107, 90, 0.08)
        textHighlight: "#f3e3a188"
      darkMode:
        light: "#141715"
        lightgray: "#2a2f2b"
        gray: "#8e958f"
        darkgray: "#d4d8d2"
        dark: "#eef1ec"
        secondary: "#8cc4ad"
        tertiary: "#d9a877"
        highlight: rgba(140, 196, 173, 0.12)
        textHighlight: "#b3aa0266"
  links:
    markdownLinkResolution: shortest
    # Mark links to notes that are not published so they can be styled as plain text.
    disableBrokenWikilinks: true
  contentIndex:
    enableSiteMap: true
    enableRSS: true
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseBlockReferences: true
      enableYouTubeEmbed: true
      enableVideoEmbed: true
    order: 40
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: googleFonts
      header:
        name: Gowun Batang
        weights: [400, 700]
      body:
        name: IBM Plex Sans KR
        weights: [400, 500, 700]
      code:
        name: IBM Plex Mono
        weights: [400, 600]
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: default
      mode: both
  # Second safety net: only pages with `publish: true` are built.
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  # Only for custom domains. On <user>.github.io/<repo> a CNAME file breaks the site.
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  # Replaced by the topic menu (custom/TopicNav.tsx, wired in quartz.ts).
  - source: "@quartz-community/explorer"
    enabled: false
    layout:
      position: left
      priority: 50
  # Replaced by the custom garden map (custom/GardenMap.tsx, wired in quartz.ts).
  - source: "@quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  # The "연결된 노트" panel (custom/GardenMap) already lists notes linking here.
  - source: "@quartz-community/backlinks"
    enabled: false
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    options:
      # The plugin's ko-KR string is still "N min read"; hide it until translated.
      showReadingTime: false
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  # Topics, not tags, are how this site is navigated.
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  # Folder paths stay internal; NoteMeta shows note type and topics instead.
  - source: "@quartz-community/breadcrumbs"
    enabled: false
    options:
      rootName: 홈
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/slowdive14
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  # The right sidebar ("연결된 노트") can be taller than the screen. It scrolls
  # away with the page (one scrollbar, nothing cut off) instead of scrolling on
  # its own behind a hidden bar, which looked cut off.
  sidebars:
    right: static
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
